# ---------------------------------------------------------------------------
# Settings are edited in the web UI ("Settings") and stored in the database,
# next to the channels and the prompts. This file only says where that database
# lives.
#
# A config.yaml from before settings moved to the database is imported into it
# on the first start, and ignored from then on (except for `database`).
# ---------------------------------------------------------------------------

# Where the SQLite database lives. Leave unset to use the XDG data directory
# ($XDG_DATA_HOME/yt-summarizer/videos.db, i.e. ~/.local/share/yt-summarizer/
# videos.db by default). An absolute path is honoured as-is; a relative path is
# resolved under the XDG data directory.
# database: videos.db
