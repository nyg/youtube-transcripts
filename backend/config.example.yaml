# ---------------------------------------------------------------------------
# Channels and prompts are managed in the web UI (stored in the database), not
# here. Add a channel from the UI and pick one of your prompts for it; each
# prompt carries its own estimated output tokens, and each channel its own
# digest recipients.
# ---------------------------------------------------------------------------

# How many recent videos (videos + lives, no Shorts) to list.
max_videos_fetch: 25

# Preferred transcript languages, in order. Falls back to any available
# transcript (including auto-generated) if none of these exist.
transcript_languages: [en]

# Minimum seconds between requests to YouTube. Raise this if you keep hitting
# "YouTube rate limit (HTTP 429)" errors; lower it at your own risk.
youtube_request_interval: 2.0

# Optional: path to a cookies file in Netscape format (e.g. exported with a
# "Get cookies.txt" browser extension while logged in to YouTube). Logged-in
# requests get noticeably higher rate limits.
# cookies_file: ~/youtube-cookies.txt

# ---------------------------------------------------------------------------
# Claude settings
# ---------------------------------------------------------------------------
model: claude-opus-4-8
max_output_tokens: 8192

# Prices in USD per 1 million tokens. Used for cost estimation — keep in sync
# with https://platform.claude.com/docs/en/pricing if they change.
pricing:
  claude-opus-4-8:  { input: 5.00, output: 25.00 }
  claude-sonnet-5:  { input: 3.00, output: 15.00 }
  claude-haiku-4-5: { input: 1.00, output: 5.00 }

# ---------------------------------------------------------------------------
# Automatic monitoring (optional)
# ---------------------------------------------------------------------------
# When enabled, a background scheduler inside the server checks on the `schedule`
# below for newly published videos on your registered channels, summarizes each
# with that channel's chosen prompt, and emails a per-channel digest (to that
# channel's recipients) via the Resend API.
#
# There is no per-run approval when this runs unattended, so `daily_budget_usd`
# is the spend guard: a video is only summarized if it keeps the day's total
# (UTC) at or under the cap; otherwise it is deferred and retried after midnight.
#
# Requires RESEND_API_KEY in the .env next to this file. `resend_from` must be an
# address on a domain you've verified at https://resend.com — for a first test
# you can use "onboarding@resend.dev" and send only to your own account email.
# Recipients are configured per channel in the web UI (a channel with no
# recipients is still summarized, just not emailed).
#
# Run the server with a single uvicorn worker so only one scheduler exists.
monitoring:
  enabled: false

  # When to check, as a 5-field cron expression: minute hour day-of-month month
  # day-of-week — evaluated in the SERVER'S LOCAL TIME, not UTC. Examples:
  #   "0 * * * *"      every hour, on the hour   (default)
  #   "*/15 * * * *"   every 15 minutes, on the quarter
  #   "0 8,20 * * *"   at 08:00 and 20:00
  #   "30 7 * * 1-5"   at 07:30 on weekdays
  schedule: "0 * * * *"

  # Also run one catch-up cycle immediately at startup, for videos published
  # while the server was down. Set to false to only ever run on the schedule.
  run_on_start: true

  max_videos_check: 5      # recent videos scanned per channel per cycle
  max_age_hours: 48        # ignore videos older than this (0 = no age limit)
  daily_budget_usd: 1.00   # hard cap across all channels (0 = unlimited)
  resend_from: "YouTube Summaries <onboarding@resend.dev>"
  subject_prefix: "New video summaries"

# ---------------------------------------------------------------------------
# Ask across videos
# ---------------------------------------------------------------------------
# The "Ask" tab answers a question from what a channel already said: the
# extracted mentions, the stored summaries and matching transcript excerpts in
# the chosen period are sent to Claude, which answers with [n] citations. Every
# question is estimated and approved before it is billed, exactly like
# summarization.
ask:
  # Ceiling on the context sent with a question. More context costs more per
  # question: at $5 / 1M input tokens, 100k tokens is about $0.50.
  max_context_tokens: 100000

  # Assumed answer length, used for the cost estimate only.
  estimated_output_tokens: 1500

# ---------------------------------------------------------------------------
# Storage
# ---------------------------------------------------------------------------
# Where the SQLite database lives. Leave unset to use the XDG data directory
# ($XDG_DATA_HOME/yt-summarizer/videos.db, i.e. ~/.local/share/yt-summarizer/
# videos.db by default). An absolute path is honoured as-is; a relative path is
# resolved under the XDG data directory.
# database: videos.db
